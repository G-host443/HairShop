# Hair_style by Garance — exemple de configuration Nginx + PHP-FPM.
# À copier dans /etc/nginx/sites-available/ puis adapter : server_name, chemin, socket PHP-FPM.
# Le certificat HTTPS est ajouté par certbot (--nginx), qui complète ce fichier.

server {
    listen 80;
    listen [::]:80;
    server_name www.votre-domaine.fr votre-domaine.fr;

    root /var/www/hairstyle/public;
    index index.php;
    charset utf-8;

    client_max_body_size 64M;          # aligné sur post_max_size de PHP
    server_tokens off;

    # Adresse canonique : sans « / » final (comme le .htaccess d'Apache)
    rewrite ^/(.+)/$ /$1 permanent;

    # Fichiers cachés (.env, .git, .htaccess…) : jamais servis
    location ~ /\. {
        deny all;
    }

    # Photos importées : aucun script exécuté, cache long
    location ^~ /uploads/ {
        location ~ \.(php|phtml|phar)$ { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Fichiers versionnés (?v=…) ou à empreinte : cache d'un an
    location ~* \.(css|js|webp|jpe?g|png|gif|avif|svg|woff2?|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Tout le reste passe par l'application
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 60s;
        internal;
    }

    # Aucun autre script PHP n'est exécutable
    location ~ \.php$ {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;
}

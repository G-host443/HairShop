# Hair_style by Garance — exemple d'hôte virtuel Apache 2.4 (PHP-FPM via proxy_fcgi).
# Modules : rewrite, headers, expires, deflate, proxy_fcgi, setenvif.
#   sudo a2enmod rewrite headers expires deflate proxy_fcgi setenvif && sudo a2enconf php8.4-fpm
# Le HTTPS est ajouté par certbot (--apache).

<VirtualHost *:80>
    ServerName www.votre-domaine.fr
    ServerAlias votre-domaine.fr

    DocumentRoot /var/www/hairstyle/public

    <Directory /var/www/hairstyle/public>
        # public/.htaccess : réécriture vers index.php, cache, compression
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # Le reste du projet (.env, storage, vendor…) n'est jamais exposé
    # (Apache applique les blocs du chemin le plus court au plus long : public/ reste accessible).
    <Directory /var/www/hairstyle>
        Require all denied
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Aligné sur post_max_size de PHP (64 Mo)
    LimitRequestBody 67108864

    ServerSignature Off
    ErrorLog ${APACHE_LOG_DIR}/hairstyle-error.log
    CustomLog ${APACHE_LOG_DIR}/hairstyle-access.log combined
</VirtualHost>
